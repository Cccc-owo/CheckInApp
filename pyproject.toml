[project]
name = "checkin-app-backend"
version = "0.1.0"
description = "FastAPI backend for CheckIn App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "bcrypt>=4.2.2",
    "croniter>=5.0.3",
    "fastapi>=0.115.12",
    "filelock>=3.16.1",
    "pydantic[email]>=2.10.6",
    "pydantic-settings>=2.7.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "playwright>=1.50.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
production = [
    "gunicorn>=23.0.0",
]
redis = [
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps"]
include = ["backend*"]
namespaces = true

[tool.setuptools.package-data]
"backend.email_templates" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "tests"]

[tool.ruff.lint]
select = ["E9", "F821"]

[tool.ruff.lint.per-file-ignores]
"apps/backend/scripts/*.py" = ["E402"]
